<title>FixUp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/leaflet-core.css">
<link rel="stylesheet" href="css/styles.css">
<style>
  /* Versão publicada do FixUp (a versão local é a index.html).
     Layout: o app ocupa a página toda; barra de navegação embaixo no celular e na lateral em telas largas.
     Cores e tipografia vêm dos tokens de css/styles.css (:root), com tema claro e escuro. */
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); }
  .app { height: 100%; }

  @media (max-width: 767px) {
    .app { --safe-top: 0px; --safe-bottom: 0px; }

    .section, .topbar, .results.list, .cta-bar, .profile-head, .receipt-head, .banner-slot:not(:empty), .chat-body, .chat-quick, .chat-compose {
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    .hero, .sheet, .track-panel {
      padding-left: max(18px, env(safe-area-inset-left, 0px));
      padding-right: max(18px, env(safe-area-inset-right, 0px));
    }
    .chat-head { margin-left: max(16px, env(safe-area-inset-left, 0px)); margin-right: max(16px, env(safe-area-inset-right, 0px)); }
    .track-top { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
    .toast-root { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
    .tabbar { padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); }
  }
  @media (min-width: 768px) {
    .tabbar, .tabbar[hidden] { padding-left: max(10px, env(safe-area-inset-left, 0px)); }
    .screen { padding-right: env(safe-area-inset-right, 0px); }
  }
</style>
<script>
  /* Aplica o tema antes de desenhar: preferência salva, tema da página que hospeda o app ou tema do aparelho. */
  (function () {
    var pref = 'auto', root = document.documentElement, host = root.getAttribute('data-theme');
    try { pref = localStorage.getItem('fixup:theme') || 'auto'; } catch (e) {}
    var dark = pref === 'dark' || (pref === 'auto' && (host ? host === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)));
    root.setAttribute('data-fx-theme', dark ? 'dark' : 'light');
  })();
</script>

<div class="app com-abertura" id="app">
  <!-- Abertura animada: aparece enquanto o app carrega (js/app.js decide quando sair) -->
  <div class="abertura" id="abertura" aria-hidden="true">
    <div class="ab-centro">
      <img class="ab-logo" src="img/abertura.svg" alt="" width="200" height="194">
      <div class="ab-marca">FixUp</div>
      <div class="ab-frase">O profissional certo para o seu problema</div>
    </div>
  </div>
  <script>
    (function () {
      var a = document.getElementById('abertura'), i = a.querySelector('img');
      function ok() { if (a.dataset.t) return; a.dataset.t = performance.now(); a.classList.add('pronto'); a.dispatchEvent(new Event('fixup-pronto')); }
      if (i.complete && i.naturalWidth) ok(); else { i.addEventListener('load', ok); i.addEventListener('error', ok); }
    })();
  </script>

  <main id="screen" class="screen"><div class="splash"><span class="spinner big"></span></div></main>
  <nav id="tabbar" class="tabbar" aria-label="Navegação principal" hidden></nav>
  <div id="sheet-root" class="sheet-root"></div>
  <div id="lightbox-root" class="lightbox-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
</div>
