<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0404E2">
  <title>FixUp — o profissional certo para o seu problema</title>
  <meta name="description" content="Descreva o problema, veja quem já resolveu casos parecidos e combine tudo pelo app: da proposta ao pagamento.">
  <!-- Ícones: aba do navegador (SVG) e tela inicial do iPhone (PNG). Gerados por ferramentas/logo. -->
  <link rel="icon" type="image/svg+xml" href="img/logo-fixup.svg">
  <link rel="apple-touch-icon" href="img/icone-180.png">
  <!-- Prévia do link no WhatsApp e nas redes sociais -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="FixUp — o profissional certo para o seu problema">
  <meta property="og:description" content="Descreva o problema, veja quem já resolveu casos parecidos e combine tudo pelo app.">
  <meta property="og:url" content="https://lucaslcp.github.io/FixUp/">
  <meta property="og:image" content="https://lucaslcp.github.io/FixUp/img/icone-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:locale" content="pt_BR">
  <!-- Aplica o tema salvo antes de desenhar a página, para não piscar. -->
  <script>
    (function () {
      var pref = 'auto';
      try { pref = localStorage.getItem('fixup:theme') || 'auto'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-fx-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- O app ocupa a tela toda: barra de navegação embaixo no celular e na lateral em tablets e computadores. -->
  <div class="app com-abertura" id="app">
    <!-- Abertura animada: aparece enquanto o app carrega (js/app.js decide quando sair) -->
    <div class="abertura" id="abertura" aria-hidden="true">
      <div class="ab-centro">
        <img class="ab-logo" src="img/abertura.svg" alt="" width="200" height="194">
        <div class="ab-marca">FixUp</div>
        <div class="ab-frase">O profissional certo para o seu problema</div>
      </div>
    </div>
    <script>
      (function () {
        var a = document.getElementById('abertura'), i = a.querySelector('img');
        function ok() { if (a.dataset.t) return; a.dataset.t = performance.now(); a.classList.add('pronto'); a.dispatchEvent(new Event('fixup-pronto')); }
        if (i.complete && i.naturalWidth) ok(); else { i.addEventListener('load', ok); i.addEventListener('error', ok); }
      })();
    </script>

    <main id="screen" class="screen"><div class="splash"><span class="spinner big"></span></div></main>
    <nav id="tabbar" class="tabbar" aria-label="Navegação principal" hidden></nav>
    <div id="sheet-root" class="sheet-root"></div>
    <div id="lightbox-root" class="lightbox-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
  </div>

  <!-- Bibliotecas: mapa (Leaflet) e ícones (Lucide) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>

  <!-- Aplicação -->
  <script src="js/config.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/lexicon.js"></script>
  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/match.js"></script>
  <script src="js/store.js"></script>
  <script src="js/payment.js"></script>
  <script src="js/mascote.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/seguranca.js"></script>
  <script src="js/midia.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/comprovantes.js"></script>
  <script src="js/client.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/pro.js"></script>
  <script src="js/conta.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
